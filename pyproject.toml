[project]
name = "xippios-usda-wasde"
version = "0.1.0"
description = "Typed client, MCP tools and HTTP routes for USDA WAOB World Agricultural Supply and Demand Estimates"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "XIPPIOS GmbH" }]
keywords = ["sdk", "usda-wasde", "mcp", "httpx", "pydantic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pypdf>=6.21",
  "xippios-core~=0.3.0",
  "xippios-usda-esmis~=0.1.0",
  "xlrd>=2.0.2",
]

[project.optional-dependencies]
mcp = ["xippios-core[mcp]~=0.3.0"]
http = ["xippios-core[http]~=0.3.0"]
testing = ["xippios-core[testing]~=0.3.0"]

[project.scripts]
xippios-usda-wasde-mcp = "xippios.usda.wasde.mcp:run"

[project.urls]
Homepage = "https://github.com/xippios/sdk-usda-wasde"
Upstream = "https://www.usda.gov/oce/commodity/wasde"
Changelog = "https://github.com/xippios/sdk-usda-wasde/blob/main/CHANGELOG.md"
Issues = "https://github.com/xippios/sdk-usda-wasde/issues"

[dependency-groups]
# ruff is pinned to the rev of the ruff-pre-commit hook in .pre-commit-config.yaml, so a new
# lock does not drift from the hook; the two move together.
dev = [
  "ruff==0.17.1",
  "mypy>=1.18",
  "pre-commit>=4",
  "pytest>=8",
  "respx>=0.22",
  "anyio>=4",
  "detect-secrets>=1.5",
  # Pinned to the `# /// script` block of scripts/refresh_upstream.py, so that mypy --strict
  # reads its types; the two pins move together.
  "markdownify==1.2.3",
  "types-xlrd>=2.0.0.20260518",
  # Writes the XLS sample in scripts/cut_sample.py and the small workbooks of the parser
  # tests; it ships no types, so mypy reads it as Any (tool.mypy.overrides below).
  "xlwt>=1.3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xippios"]

[tool.hatch.build.targets.sdist]
# Anchored: hatch reads gitignore-style patterns, so a bare README.md would match a
# README.md in any directory. The sdist ships no tests; they live in the repository.
include = ["/src", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PTH", "PT", "T20", "C4"]
ignore = [
  "ANN401", # Any is allowed where upstream payloads are untyped by nature
  "D105",   # magic methods need no docstring
  "D107",   # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["xippios.usda.wasde"]
known-third-party = ["xippios.core"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["xlwt"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
# record_property, in a live test say, warns under xunit2 when a run writes --junitxml.
junit_family = "xunit1"
